<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ap2ex-release</title>
</head>
<body class="bg-black text-[#af6527] uppercase select-none font-sans text-lg antialiased md:subpixel-antialiased font-semibold tracking-wide text-base/6">
    <main class="grid grid-rows-4 gap-4 m-12 grid-cols-1 sm:grid-cols-3 ">
        <header class="row flex items-center justify-center mb-8 mt-8 sm:col-start-2">
            <div class="w-44 h-44 rounded-full bg-black" style="filter: drop-shadow(0 0 10px #af6527);"></div>
        </header>
        <div class="sm:col-start-2 row w-full bg-[#111111de] border-x-[#e27e31] border-y-[#af6527] border border-solid border-transparent rounded-xl">
            <div class="block p-4 w-full h-full flex flex-col flex-center flex-wrap justify-around gap-4">
                <div class="flex flex-row flex-wrap gap-2 content-center">
                <div class="self-center w-[4rem] pl-4 sm:p-1">
                    <img src="icons/soundcloud.svg" alt="SoundCloud" width="64" height="64"></div>
                <music-player src="https://on.soundcloud.com/XZ05ZzYIGjgGX0AxTw"></music-player>
                </div>
                <div class="flex flex-row flex-wrap gap-2 content-center">
                    <div class="pl-4 sm:pl-1 self-center w-[4rem]"><img src="icons/ytmusic.svg" alt="Youtube Music" width="48" height="48"></div>
                    <music-player src="https://music.youtube.com/"></music-player>
                </div>
            </div>
        </div>
        <div class="sm:col-start-2 row w-full bg-[#111111de] border-x-[#e27e31] border-y-[#af6527] border border-solid border-transparent rounded-xl">
            <div class="block p-4 w-full h-full flex flex-col flex-center flex-wrap justify-around content-center gap-4">
                <h2 class="text-2xl">Бонуси</h2>
                <a class="hover:text-[#e27e31] delay-150 duration-300 border-b border-b-[#af6527] solid" target="_blank" href="https://youtu.be/EEqOtqZHb5M">Бонус раз</a>
                <a class="hover:text-[#e27e31] delay-150 duration-300 border-b border-b-[#af6527] solid" target="_blank" href="https://youtu.be/uTyJmcMPFKo">Бонус два</a>
            </div>
        </div>
        <footer class="sm:col-start-2 row flex items-center justify-center"><h4 class="underline underline-offset-8 decoration-double decoration-4">Контакти</h4></footer>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
