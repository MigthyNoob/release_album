<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ap2ex-release</title>
</head>
<body class="bg-black text-[#af6527] uppercase select-none font-sans text-lg antialiased md:subpixel-antialiased font-semibold tracking-wide text-base/6">
    <main class="grid grid-rows-4 gap-4 m-12 grid-cols-1 sm:grid-cols-3 ">
        <header class="row flex items-center justify-center mb-8 mt-8 sm:col-start-2">
            <div class="w-44 h-44 rounded-full bg-black" style="filter: drop-shadow(0 0 10px #af6527);"></div>
        </header>
        <div class="sm:col-start-2 row w-full bg-[#111111de] border-x-[#e27e31] border-y-[#af6527] border border-solid border-transparent rounded-xl">
            <div class="block p-4 w-full h-full flex flex-col flex-center flex-wrap justify-around gap-4">
                <div class="flex flex-row flex-wrap gap-2 content-center">
                <div class="self-center w-[4rem] pl-4 sm:p-1">
                    <img src="icons/soundcloud.svg" alt="SoundCloud" width="64" height="64"></div>
                <music-player src="https://on.soundcloud.com/XZ05ZzYIGjgGX0AxTw"></music-player>
                </div>
                <div class="flex flex-row flex-wrap gap-2 content-center">
                    <div class="pl-4 sm:pl-1 self-center w-[4rem]"><img src="icons/ytmusic.svg" alt="Youtube Music" width="48" height="48"></div>
                    <music-player src="https://music.youtube.com/"></music-player>
                </div>
            </div>
        </div>
        <div class="sm:col-start-2 row w-full bg-[#111111de] border-x-[#e27e31] border-y-[#af6527] border border-solid border-transparent rounded-xl">
            <div class="block p-4 w-full h-full flex flex-col flex-center flex-wrap justify-around content-center gap-4">
                <h2 class="text-2xl">Бонуси</h2>
                <a class="hover:text-[#e27e31] delay-150 duration-300 border-b border-b-[#af6527] solid" target="_blank" href="https://youtu.be/EEqOtqZHb5M">Бонус раз</a>
                <a class="hover:text-[#e27e31] delay-150 duration-300 border-b border-b-[#af6527] solid" target="_blank" href="https://youtu.be/uTyJmcMPFKo">Бонус два</a>
            </div>
        </div>
        <footer class="sm:col-start-2 flex flex-col items-center justify-center">
            <h4 class="underline underline-offset-8 decoration-double decoration-4">Контакти</h4>
            <div class="flex flex-row items-center justify-around w-[50%] mt-8">
            <!--Instagram logo-->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg"
                 class="group cursor-pointer transition-transform duration-300 delay-150 hover:scale-125" role="img" aria-label="Instagram">

              <g class="stroke-[#af6527] group-hover:stroke-[#e27e31] transition-colors duration-300 delay-150"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

                <path d="M7.5 3.2 C11 2.6 15 3.4 17.6 3 C20.6 3.2 21 6 20.6 8.5 C21.2 12 20.4 16 20.8 17.4 C20.4 20.6 18 21 15.6 20.6 C12 21.2 8.5 20.4 6.4 20.8 C3.4 20.4 3 18 3.4 15.6 C2.8 12 3.6 9 3.2 6.6 C3.4 4.2 5 3.4 8.4 3.6" />

                <path d="M12.6 8 C15.4 8.2 16.8 10.6 16 13 C15.2 15.6 12.2 16.6 10 15.4 C7.8 14 7.8 10.2 9.6 8.8 C10.4 8.2 11.4 8 12.4 8.4" />

                <path d="M17.2 6.6 L17.5 6.9" stroke-width="2.4" />
              </g>
            </svg>
                <!--Behance logo-->
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     class="group cursor-pointer transition-transform duration-300 delay-150 hover:scale-125" role="img" aria-label="Behance">

                  <g class="stroke-[#af6527] group-hover:stroke-[#e27e31] transition-colors duration-300 delay-150"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                     transform="translate(2.4 0) skewX(-8)">

                    <path d="M6 4 L4.5 19 M6 4 C12.5 3 13 9.5 5.8 10.5 C14 10 14.5 18.5 4.5 19" />

                    <path d="M15 13.5 H21.5 C21.5 9.5 17 9 15.5 12.5 C14 16 17 19 21.5 17" />

                    <path d="M2 21.5 C9 20 17 21.5 23 20" stroke-width="1.4" />
                    <path d="M9 21 V23" stroke-width="1.2" />
                  </g>
                </svg>
                <!--VD4 logo-->
                <svg width="48" height="48" viewBox="0 0 220 200" fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     class="group cursor-pointer transition-transform duration-300 delay-150 hover:scale-125 group" role="img" aria-label="VD4 logo">

                  <g class="stroke-[#af6527] group-hover:stroke-[#e27e31] transition-colors duration-300 delay-150"
                     stroke-width="11" stroke-linecap="round" stroke-linejoin="round">

                    <g transform="rotate(-7 45 100)">
                      <path d="M12 66 C20 84 28 108 43 134 C52 110 60 86 78 52" />
                    </g>

                    <g transform="rotate(5 120 100)">
                      <path d="M97 48 C94 76 93 110 96 142" />
                      <path d="M91 60 C134 44 160 78 152 106 C146 132 120 140 99 126" />
                    </g>

                    <g transform="rotate(-5 180 100)">
                      <path d="M180 60 C176 80 164 98 152 114 C170 120 192 112 208 118" />
                      <path d="M187 56 C190 88 183 120 188 148" />
                    </g>
                  </g>
                </svg>
            </div>
        </footer>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
